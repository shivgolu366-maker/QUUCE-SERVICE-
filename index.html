    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuickService" />
    <meta name="application-name" content="QuickService" />

    <link rel="manifest" href="/manifest.json" />

  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new Event('app_install_ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
