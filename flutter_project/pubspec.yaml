name: quick_service
description: "Quick Service - On-Demand Multi-Service Mobile App (Customer, Partner & Runner Dispatch)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_maps_flutter: ^2.5.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  http: ^1.2.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
